<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OpenGHub</title>
    <style>
      /* Splash screen. Inline and framework-free so it paints with the very
         first frame — the webview would otherwise show a black window until
         SvelteKit has booted. Two bars turn and *deform* into OpenGHub's mark
         (SVG path interpolation: the bars are drawn with zero-radius arcs, so
         they share their command structure with the ring halves), which then
         breathes until the layout removes the splash (`#splash.done`). It also
         takes itself away after 10 s, in case boot goes wrong. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #000;
        animation: splash-timeout 0s linear 10s forwards;
      }

      #splash.done {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }

      #splash .mark {
        width: 118px;
        height: 118px;
        animation: splash-breathe 1.9s ease-in-out 1.15s infinite;
      }

      /* The pair turns a full circle while it takes shape, so the mark ends
         upright however far the morph has come. */
      #splash .turn {
        transform-origin: 50% 50%;
        animation: splash-turn 0.95s cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }

      #splash .accent {
        fill: #1196ff;
        animation: splash-to-white 0.35s ease 0.75s forwards;
      }

      #splash .white {
        fill: #fff;
      }

      @keyframes splash-turn {
        from { transform: rotate(-150deg); }
        to { transform: rotate(0deg); }
      }

      @keyframes splash-to-white {
        to { fill: #fff; }
      }

      @keyframes splash-breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }

      @keyframes splash-timeout {
        to { opacity: 0; pointer-events: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #splash .mark,
        #splash .turn,
        #splash .accent {
          animation: none !important;
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="tap">
    <div id="splash" aria-hidden="true">
      <svg class="mark" viewBox="0 0 132 132" xmlns="http://www.w3.org/2000/svg">
        <g class="turn">
          <path class="half accent" d="M 66.0,26.3 A 39.7,39.7 0 0 1 66.0,105.7 L 66.0,85.6 A 19.6,19.6 0 0 0 66.0,46.4 Z">
            <animate attributeName="d" dur="0.9s" fill="freeze" calcMode="spline"
                     keyTimes="0;1" keySplines="0.65 0 0.35 1" values="M 72,28 A 0,0 0 0 1 72,76 L 92,76 A 0,0 0 0 0 92,28 Z;M 66.0,26.3 A 39.7,39.7 0 0 1 66.0,105.7 L 66.0,85.6 A 19.6,19.6 0 0 0 66.0,46.4 Z" />
          </path>
          <path class="half white" d="M 66.0,105.7 A 39.7,39.7 0 0 1 66.0,26.3 L 66.0,46.4 A 19.6,19.6 0 0 0 66.0,85.6 Z">
            <animate attributeName="d" dur="0.9s" fill="freeze" calcMode="spline"
                     keyTimes="0;1" keySplines="0.65 0 0.35 1" values="M 60,104 A 0,0 0 0 1 60,56 L 40,56 A 0,0 0 0 0 40,104 Z;M 66.0,105.7 A 39.7,39.7 0 0 1 66.0,26.3 L 66.0,46.4 A 19.6,19.6 0 0 0 66.0,85.6 Z" />
          </path>
          <!-- The stem that cuts the ring, as in the logo. -->
          <rect x="58.5" y="0" width="15" height="132" fill="#000"/>
        </g>
      </svg>
    </div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
