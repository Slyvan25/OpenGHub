# Flatpak manifest. Built in CI from the release .deb (see release.yml), so the
# binary is identical to the other packages; `flatpak-builder --user --install
# build-dir packaging/flatpak/com.openghub.app.yml` builds it locally once
# OpenGHub_<version>_amd64.deb sits next to this file.
#
# What the sandbox needs and why:
#   --device=all                      /dev/hidraw* (HID++) and /dev/uinput (the FF wheel and
#                                     the virtual keyboard); there is no portal for either
#   --talk-name=org.freedesktop.Flatpak
#                                     flatpak-spawn --host: pkexec for the udev rule,
#                                     gst-launch-1.0 / parec for LIGHTSYNC, steam / lutris /
#                                     xdg-open for the launcher, loginctl for "lock computer"
#   --talk-name=org.kde.StatusNotifierWatcher
#                                     the tray icon
#   --filesystem=xdg-config/autostart:create
#                                     "Launch at startup"
#   read-only views of the game launchers' folders, for the Games tab
id: com.openghub.app
runtime: org.gnome.Platform
runtime-version: "47"
sdk: org.gnome.Sdk
command: openghub
finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --share=network
  - --device=dri
  - --device=all
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-config/autostart:create
  - --filesystem=~/.steam:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.var/app/com.valvesoftware.Steam/.local/share/Steam:ro
  - --filesystem=~/snap/steam/common/.local/share/Steam:ro
  - --filesystem=xdg-config/heroic:ro
  - --filesystem=~/.var/app/com.heroicgameslauncher.hgl/config/heroic:ro
  - --filesystem=xdg-config/lutris:ro
  - --filesystem=~/.var/app/net.lutris.Lutris/config/lutris:ro
modules:
  - name: openghub
    buildsystem: simple
    build-commands:
      - ar -x OpenGHub_*_amd64.deb
      - tar -xf data.tar.*
      - install -Dm755 usr/bin/openghub /app/bin/openghub
      - install -Dm644 usr/share/applications/OpenGHub.desktop /app/share/applications/com.openghub.app.desktop
      - sed -i 's/^Icon=.*/Icon=com.openghub.app/' /app/share/applications/com.openghub.app.desktop
      - for s in 32x32 128x128 256x256@2; do install -Dm644 usr/share/icons/hicolor/$s/apps/openghub.png /app/share/icons/hicolor/$s/apps/com.openghub.app.png; done
      - install -Dm644 com.openghub.app.metainfo.xml /app/share/metainfo/com.openghub.app.metainfo.xml
    sources:
      - type: file
        path: OpenGHub_0.1.0_amd64.deb
      - type: file
        path: com.openghub.app.metainfo.xml
